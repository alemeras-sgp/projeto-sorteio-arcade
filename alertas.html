<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta OBS - Sorteio</title>

    <style>
        /* Fundo transparente essencial para o OBS */
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;

            /* CENTRALIZAÇÃO TOTAL */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #container-alerta {
            /* Efeito de Vidro Embaçado (Glassmorphism) */
            background: rgba(18, 18, 20, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            
            color: white;
            padding: 40px 35px 25px 35px; /* Mais espaçamento em cima para acomodar o banner flutuante */
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            width: 450px;
            text-align: center;
            border: 1px solid rgba(130, 87, 229, 0.5); /* Borda roxa neon sutil */
            position: relative;

            /* Estado inicial escondido */
            opacity: 0;
            transform: translateY(150px) scale(0.8);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Classe que fará o alerta pular na tela */
        #container-alerta.mostrar {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Estilo do Banner Flutuante no Topo */
        #banner-alerta {
            position: absolute;
            top: -32px; /* Joga parte do banner para fora, por cima da caixa de vidro */
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 55px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #8257e5;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
            background: #121214;
            display: none; /* Só aparece quando o link for carregado com sucesso */
        }

        #nome-usuario {
            margin: 10px 0 10px 0;
            font-size: 2rem;
            color: #00e676;
            text-transform: uppercase;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.8);
            font-weight: 800;
        }

        #msg-usuario {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1.4;
            color: #e1e1e6;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
            word-break: break-word;
        }
    </style>
</head>

<body>
    <button id="btn-desbloqueio"
        style="position: absolute; top: 20px; left: 20px; z-index: 9999; padding: 20px; background-color: #ff0000; color: white; font-weight: bold; border: none; border-radius: 8px; cursor: pointer;">
        🔴 CLIQUE AQUI NO OBS (INTERAGIR) PARA LIBERAR ÁUDIO
    </button>
    
    <div id="container-alerta">
        <!-- Banner flutuante do sorteio puxado do banco -->
        <img id="banner-alerta" src="" alt="Banner Sorteio">
        
        <h2 id="nome-usuario">Nome de Teste</h2>
        <p id="msg-usuario">Bora Alemeras! Rumo a esse Arcade Stick brabo demais!</p>
    </div>

    <audio id="player-voz" style="display: none;"></audio>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // 1. Configuração do Supabase
        const supabaseUrl = 'https://wfnimuncbyvfglhbqjtj.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmbmltdW5jYnl2ZmdsaGJxanRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MTkwMzIsImV4cCI6MjA5NjE5NTAzMn0.Q9GD87K1hQ0IYzN0sXuKOUWBvbXT9-K0DhWorIJwDdw';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Função para carregar dinamicamente o banner oficial do sorteio atual
        async function carregarBannerAlerta() {
            try {
                const { data, error } = await db
                    .from('configuracoes')
                    .select('banner_url')
                    .eq('id', 1)
                    .single();

                if (data && data.banner_url) {
                    const imgBanner = document.getElementById('banner-alerta');
                    imgBanner.src = data.banner_url;
                    imgBanner.style.display = 'block';
                }
            } catch (e) {
                console.error("Erro ao carregar banner para o alerta:", e);
            }
        }

        // Executa a busca do banner assim que carrega
        carregarBannerAlerta();

        // Lógica de destrave do áudio
        document.getElementById('btn-desbloqueio').addEventListener('click', () => {
            const somTeste = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

            somTeste.play().then(() => {
                console.log("OBS destravou o áudio com sucesso!");
                document.getElementById('btn-desbloqueio').style.display = 'none';
            }).catch(err => {
                console.error("Erro no destrave:", err);
            });
        });

        // 2. Sistema de Fila (Queue) e Memória de Tempo
        const filaAlertas = [];
        let exibindoAlerta = false;
        const alertasRecentes = new Map();

        // 3. O Ouvinte do Banco de Dados (Realtime)
        db.channel('mudancas_obs')
            .on('postgres_changes',
                { event: 'UPDATE', schema: 'public', table: 'sorteio' },
                (payload) => {
                    const numeroMudou = payload.new;
                    const numeroAntigo = payload.old;

                    if (numeroMudou.status === 'pago' && numeroAntigo.status !== 'pago') {

                        const nomeComprador = numeroMudou.nome_comprador;
                        const agora = Date.now();
                        const tempoUltimoAlerta = alertasRecentes.get(nomeComprador) || 0;

                        if (agora - tempoUltimoAlerta > 15000) {
                            alertasRecentes.set(nomeComprador, agora);

                            filaAlertas.push({
                                nome: nomeComprador,
                                mensagem: numeroMudou.mensagem_live || "Comprou e já garantiu a participação no sorteio!",
                                voz: numeroMudou.voz_escolhida || "default"
                            });
                            processarFila();
                        }
                    }
                }
            ).subscribe();

        // 4. O Motor da Fila e Notificação
        async function processarFila() {
            if (exibindoAlerta || filaAlertas.length === 0) return;

            exibindoAlerta = true;
            const alertaAtual = filaAlertas.shift();

            let textoReal = alertaAtual.mensagem || "";
            if (textoReal.includes('|')) {
                textoReal = textoReal.split('|')[1].trim();
            }

            // Exibir na tela
            document.getElementById('nome-usuario').textContent = alertaAtual.nome;
            document.getElementById('msg-usuario').textContent = textoReal;
            const container = document.getElementById('container-alerta');
            container.classList.add('mostrar');

            // --- ÁUDIO DE ALERTA (BIP PADRÃO) ---
            const playerAudio = document.getElementById('player-voz');
            playerAudio.src = "https://actions.google.com/sounds/v1/alarms/beep_short.ogg";
            playerAudio.volume = 0.5;

            playerAudio.play().catch(e => console.error("Erro no áudio do OBS:", e));

            // Tempo na tela: 8000 milissegundos (8 segundos)
            setTimeout(() => {
                container.classList.remove('mostrar');
                setTimeout(() => {
                    exibindoAlerta = false;
                    processarFila();
                }, 600);
            }, 8000);
        }

        // --- Ouvinte do Botão de Replay do Admin ---
        db.channel('canal_replay_alertas')
            .on('broadcast', { event: 'forcar_alerta' }, (mensagem) => {
                const dados = mensagem.payload;
                console.log("Comando de replay recebido do Admin:", dados);

                filaAlertas.push({
                    nome: dados.nome,
                    mensagem: dados.mensagem,
                    voz: dados.voz_escolhida || "default"
                });

                processarFila();
            })
            .subscribe();
    </script>
</body>

</html>
