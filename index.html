<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alemeras | Links e Comunidade</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        /* Perfil / Foto */
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #8257e5;
            object-fit: cover;
            margin: 0 auto 15px auto;
            box-shadow: 0 0 15px rgba(130, 87, 229, 0.4);
        }

        h1 {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 5px;
        }

        p {
            font-size: 0.95rem;
            color: #a8a8b3;
            margin-bottom: 30px;
        }

        /* Links / Botões */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #202024;
            color: #fff;
            padding: 14px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            border: 1px solid #29292e;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-link:hover {
            background: #29292e;
            border-color: #8257e5;
            transform: translateY(-2px);
        }

        /* Botão em Destaque (Sorteio) */
        .btn-destaque {
            background: linear-gradient(135deg, #8257e5 0%, #6835db 100%);
            border: none;
            animation: pulse-glow 2s infinite;
        }

        .btn-destaque:hover {
            background: linear-gradient(135deg, #9466ff 0%, #7540e8 100%);
            border-color: transparent;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(130, 87, 229, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(130, 87, 229, 0); }
            100% { box-shadow: 0 0 0 0 rgba(130, 87, 229, 0); }
        }

        /* Rodapé */
        footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #737380;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sua Logo ou Foto (substitua o link da imagem se quiser) -->
        <img src="images/banner.png" alt="Alemeras" class="profile-img">
        
        <h1>Canal Alemeras</h1>

        <div class="links-list">
            <!-- BOTÃO DE DESTAQUE PARA O SORTEIO -->
            <a href="/arcade" class="btn-link btn-destaque">
                🎟️ Participe do Sorteio Atual!
            </a>

            <!-- Suas Redes Sociais (Substitua os links # pelos seus links reais) -->
            <a href="https://youtube.com/@alemeras" target="_blank" class="btn-link">
               Canal no YouTube
            </a>

            <a href="https://twitch.tv/seu_canal" target="_blank" class="btn-link">
                 Canal na Twitch
            </a>

            <a href="https://instagram.com/seu_instagram" target="_blank" class="btn-link">
                 Instagram Oficial
            </a>

            <a href="https://twitter.com/seu_twitter" target="_blank" class="btn-link">
                X (Twitter)
            </a>

        </div>

        <footer>
            &copy; 2026 Alemeras. Todos os direitos reservados.
        </footer>
    </div>

</body>
</html>
